name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: shellcheck and dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck and jq
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: make check
        run: make check
